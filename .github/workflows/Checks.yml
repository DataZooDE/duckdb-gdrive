#
# Correctness gates that the reusable distribution workflow cannot host.
#
# The live suite runs against REAL Google Drive -- there is no fake and no
# replay (plan decision D-1). That has a consequence worth stating plainly:
# a pull request from a FORK cannot access repository secrets, so it runs the
# credential-free layers only. `live` is skipped there, visibly, rather than
# passing vacuously.
#
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: full live suite + sweep the scratch folders that crashed runs
    # leaked. 03:17 UTC, off the hour to dodge the scheduler stampede.
    - cron: '17 3 * * *'

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. No credentials, no network. Anyone can reproduce this.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials tracked (REQ-NF-03)
        run: ./scripts/check_no_credentials.sh

  # A submodule that has drifted off the shipped tag makes every local green
  # meaningless: DuckDB's C++ API differs between versions, so code can
  # compile for the developer and fail on all platforms. Cheap, so it runs
  # before anything expensive.
  pin:
    name: duckdb submodule on the shipped tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: ./scripts/check_duckdb_pin.sh

  # ---------------------------------------------------------------------------
  # musl. The 1.4 LTS matrix builds linux_amd64_musl, whose headers do NOT
  # pull in <cstdint> transitively the way glibc's do. A missing include is
  # therefore invisible on every machine a developer owns and breaks exactly
  # one distribution target -- which is how it actually happened.
  #
  # Two layers: a grep that names the offending file in milliseconds, and a
  # real musl compile of the pure sources that catches whatever the grep did
  # not think of. Both finish long before the ~20-minute matrix build would.
  # ---------------------------------------------------------------------------
  musl:
    name: musl compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixed-width integer types include <cstdint>
        run: ./scripts/check_cstdint.sh
      - name: Compile pure sources against musl
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3.20 sh -c '
            set -e
            apk add --no-cache g++ git openssl-dev >/dev/null
            # picojson and jwt-cpp are header-only; fetch just the headers
            # rather than bootstrapping vcpkg inside the container.
            git clone -q --depth 1 https://github.com/kazuho/picojson.git /tmp/picojson
            git clone -q --depth 1 https://github.com/Thalhammer/jwt-cpp.git /tmp/jwt
            mkdir -p /tmp/inc/picojson && cp /tmp/picojson/picojson.h /tmp/inc/picojson/
            cp -r /tmp/jwt/include/jwt-cpp /tmp/inc/
            fail=0
            for f in src/gdrive_uri.cpp src/gdrive_errors.cpp src/gdrive_glob.cpp \
                     src/gdrive_service_account_pure.cpp src/gdrive_version.cpp; do
              if g++ -std=c++17 -fsyntax-only -DPICOJSON_USE_INT64 \
                     -Isrc/include -I/tmp/inc "$f"; then
                echo "  ok   $f"
              else
                echo "  FAIL $f"; fail=1
              fi
            done
            exit $fail
          '

  unit:
    name: Pure-logic + credential-free SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_TOOLCHAIN_PATH=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build
        run: GEN=ninja make
      - name: Catch2 pure-logic tests
        run: make unit_test
      - name: SQL tests (live ones skip without credentials)
        run: make test
      - name: Static linkage allowlist
        run: make smoke_static
      # The artifact users actually install. Everything above tests the
      # statically linked shell, which never exercises the LOAD-time DuckDB
      # version handshake -- a stale CMake cache once stamped the artifact
      # for a commit hash instead of v1.5.5 and it could not be loaded by
      # anyone, while every test stayed green.
      - name: Extension stamped for the target DuckDB
        run: make check_stamp
      - name: Shipped artifact loads in a stock duckdb
        run: make smoke_loadable

  # ---------------------------------------------------------------------------
  # The real thing. Needs secrets, so it cannot run on fork PRs.
  # ---------------------------------------------------------------------------
  live:
    name: Live tests against real Google Drive
    runs-on: ubuntu-latest
    # `secrets` is not available in job-level `if`, so gate on the event
    # instead: fork PRs have a head repo different from the base repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v5
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_TOOLCHAIN_PATH=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build
        run: GEN=ninja make
      - name: Live SQL tests
        env:
          # Reads run as the service account.
          GDRIVE_CI_SA_KEY_B64: ${{ secrets.GDRIVE_CI_SA_KEY_B64 }}
          GDRIVE_CI_DRIVE_ID: ${{ secrets.GDRIVE_CI_DRIVE_ID }}
          # Writes run as a delegated user. A service account has NO Drive
          # storage quota and cannot create a file outside a Shared Drive, so
          # seeding and every write test need a real user's quota. A runner
          # cannot do browser consent, so the refresh token is minted once
          # locally (make oauth_consent) and stored as a secret.
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_USER_REFRESH_TOKEN: ${{ secrets.GDRIVE_USER_REFRESH_TOKEN }}
        run: make test_live
      - name: E2E harness
        env:
          # Reads run as the service account.
          GDRIVE_CI_SA_KEY_B64: ${{ secrets.GDRIVE_CI_SA_KEY_B64 }}
          GDRIVE_CI_DRIVE_ID: ${{ secrets.GDRIVE_CI_DRIVE_ID }}
          # Writes run as a delegated user. A service account has NO Drive
          # storage quota and cannot create a file outside a Shared Drive, so
          # seeding and every write test need a real user's quota. A runner
          # cannot do browser consent, so the refresh token is minted once
          # locally (make oauth_consent) and stored as a secret.
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_USER_REFRESH_TOKEN: ${{ secrets.GDRIVE_USER_REFRESH_TOKEN }}
        run: make e2e

  # ---------------------------------------------------------------------------
  # Crashed runs leak /scratch/run-* folders. Left alone they fill the Shared
  # Drive and every later test fails for an unrelated reason.
  # ---------------------------------------------------------------------------
  sweep:
    name: Sweep orphaned scratch folders
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - env:
          GDRIVE_CI_SA_KEY_B64: ${{ secrets.GDRIVE_CI_SA_KEY_B64 }}
          GDRIVE_CI_DRIVE_ID: ${{ secrets.GDRIVE_CI_DRIVE_ID }}
        run: make sweep_orphans
