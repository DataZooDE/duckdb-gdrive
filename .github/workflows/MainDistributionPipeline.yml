#
# Build, test and (on main/tags) publish the extension binaries.
#
# Architectures we explicitly exclude:
#   windows_amd64_mingw -- vcpkg's OpenSSL port on MinGW is fragile; sibling
#     extensions (erpl-web, quack-oauth, anofox-tabular) also skip it.
#   wasm_* -- the extension's whole purpose is HTTPS calls to the Drive API,
#     and the OAuth redirect flow needs a loopback server. Neither is viable
#     in a browser sandbox. A clean "not available on wasm" beats shipping an
#     artifact that builds green and then fails to LOAD (symbol resolution in
#     a side-module is deferred to load time, so CI would not catch it).
#
# Build matrix: current stable (v1.5.6), built, smoke-tested and deployed,
# plus the DuckDB 2.0 pre-release line (built and tested only; see
# duckdb-next-build). Both are built, because a community extension is
# installed against whichever DuckDB the user is running and the C++ API
# differs between the lines. DuckDB 1.4.x LTS is no longer supported.
#
# The ci-tools refs are the ROLLING branches -- v1.5-variegata and
# v2.0-cyanoptera -- not per-patch tags, matching the sibling extensions
# (erpl-web). A per-patch pin means the workflow silently ages out of step
# with the toolchain fixes that land on the branch.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: only the deploy job may mint an OIDC token (to assume
# the erpl AWS role); the build and smoke jobs get read-only contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: gdrive
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  # DuckDB 2.0 (pre-release): the line community-extensions now builds
  # `repo.ref` against (DUCKDB_LATEST_STABLE in its build.yml, with
  # extension-ci-tools v2.0-cyanoptera). Build + test on every platform so a
  # 2.0-only break shows up here before it shows up in their CI. No smoke test
  # (there is no stock 2.0 CLI to load into) and no deploy (an alpha binary
  # loads only into that exact alpha build). When community-extensions moves
  # its 2.0 commit, move this one with it.
  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: gdrive
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  # Publish the built binaries to the erpl.io distribution bucket, so users can
  #   INSTALL gdrive FROM 'http://get.erpl.io';   (DuckDB started with -unsigned,
  # as the binary is unsigned). This is a mirror of the community-extensions
  # channel (D-4), not a replacement -- it lets erpl.io ship a build the moment
  # a tag lands, without waiting on the community build queue.
  #
  # Only the v1.5.6 line is deployed (a 2.0 pre-release binary loads only into
  # that exact build). The S3 key carries the DuckDB version (see
  # scripts/extension-upload.sh), so each DuckDB line lands on its own path and
  # DuckDB resolves whichever matches the client it runs.
  #
  # Gated to main / version tags: PRs build and test but never deploy, so the
  # deploy never needs OIDC credentials on a pull request. The reusable deploy
  # workflow assumes the erpl AWS role via OIDC (id-token: write, granted to the deploy jobs only) and
  # reads the bucket from the DEPLOY_S3_BUCKET repo/org variable.
  duckdb-stable-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: gdrive
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-stable-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-stable-build, duckdb-stable-smoke-test]
    # Never past a failed smoke test. `!cancelled()` alone overrides the
    # implicit success() check on `needs`, which let an artifact that fails to
    # load in a stock CLI ship. Note the consequence, intended: an arch whose
    # BUILD fails has no artifact, so its smoke test -- and with it the whole
    # deploy of that line -- fails too. Nothing ships half a matrix.
    permissions:
      id-token: write
      contents: read
    if: ${{ !cancelled() && needs.duckdb-stable-smoke-test.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      extension_name: gdrive
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and
      # its deploy resolves the tag at upload time: when it ran after the tag run it
      # overwrote the release with that pre-tag build (v2026.10.17, gdrive v1.5.6).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
